<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoDine Agent Hub</title>
  <link rel="stylesheet" href="static/style.css" />
</head>
<body class="landing">
  <header class="landing-header">
    <h1>🍽️ AutoDine Agent Hub</h1>
    <p>无人甜品店智能体控制台 —— 选择一个 Agent 开始对话</p>
  </header>
  <main class="cards">
    <a class="card" href="/consumer" style="--accent:#16a34a">
      <div class="card-emoji">🛒</div>
      <h2>Consumer Agent</h2>
      <p>消费者点餐助手 · 菜单推荐 · 智能点餐 · 查单退单</p>
      <span class="card-go">进入 →</span>
    </a>
    <a class="card" href="/kitchen" style="--accent:#2563eb">
      <div class="card-emoji">👨‍🍳</div>
      <h2>Kitchen Agent</h2>
      <p>后厨助手 · 生产咨询 · 领料清单 · 生产状态推进</p>
      <span class="card-go">进入 →</span>
    </a>
    <a class="card" href="/manager" style="--accent:#7c3aed">
      <div class="card-emoji">📊</div>
      <h2>Manager Agent</h2>
      <p>店长助手 · 库存质量 · 告警处理 · 排队 · 运营总结</p>
      <span class="card-go">进入 →</span>
    </a>
  </main>
</body>
</html>
