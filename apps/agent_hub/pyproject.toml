[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodine-agent-hub"
version = "0.1.0"
description = "AutoDine Agent Hub: Consumer / Kitchen / Manager agents driven by tool calling against the Core REST API."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_hub.web" = ["*.html", "static/*.css", "static/*.js"]
