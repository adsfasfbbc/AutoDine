[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "front-vision"
version = "0.1.0"
description = "AutoDine M02 front-of-house edge vision service (people counting)"
requires-python = ">=3.13"

dependencies = [
    # 6.11.2 fails to load Qt6Core.dll (icuuc.dll) on Windows here; 6.8.x verified.
    "PySide6>=6.8,<6.9",
    "sounddevice>=0.5",
    "librosa>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]
