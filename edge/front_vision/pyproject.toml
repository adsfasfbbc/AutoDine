[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "front-vision"
version = "0.1.0"
description = "AutoDine M02 front-of-house edge vision service (people counting + emotion recognition)"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]
