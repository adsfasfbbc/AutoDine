notes:
  - Keep all image archives and checkpoints outside Git.
  - Record immutable download hashes and split manifests before training.
  - Do not mix images from the same capture burst across train and test splits.
  - FRUIT-16K original split metrics are inflated by exact cross-split duplicates; even the exact-deduplicated audit may retain near-duplicate capture frames.
  - The security prototype has not been trained on VIRAT or UCF-Crime; its current person detector uses pretrained YOLO weights.

