[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodine"
version = "0.1.0"
description = "AutoDine v1 monorepo skeleton and shared interface contracts."
requires-python = ">=3.8"

[project.optional-dependencies]
test = ["jsonschema>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
